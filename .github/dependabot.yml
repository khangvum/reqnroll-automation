---
version: 2
updates:
  # 1. NuGet dependencies (.csproj)
  - package-ecosystem: nuget
    directories:
      - "ReqnrollAutomation"
      - "ReqnrollAutomation.Core"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10

  # 2. CI/CD Pipeline dependencies (.github/workflows/*.yml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
