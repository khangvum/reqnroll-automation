name: Reqnroll Automation

on:
  workflow_dispatch:
    inputs:
      target_project:
        description: "Target Project"
        required: true
        default: "CarfaxCanadaWebsite"
        type: choice
        options:
          - CarfaxCanadaWebsite
          - SwagLabs
      execution_mode:
        description: "Execution Mode"
        required: true
        default: "parallel"
        type: choice
        options:
          - parallel
          - sequential
      category:
        description: "Category"
        required: false
        default: ""
        type: string
      test_environment:
        description: "Test Environment"
        required: true
        default: "QA"
        type: choice
        options:
          - QA
          - Dev
          - Prod

  # Automatically trigger the workflow on push to the master branch
  push:
    branches:
      - master
    paths:
      - 'ReqnrollAutomation/**'

jobs:
  test:
    runs-on: windows-latest
    env:
      Headless: "true"
      # Fallback to QA if triggered via push instead of workflow_dispatch
      TestEnvironment: ${{ inputs.test_environment || 'QA' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Download previous test results if this is a rerun attempt
      - name: Download Previous Test Results
        if: github.run_attempt > 1
        uses: actions/download-artifact@v4
        with:
          name: TestReport
          path: TestResults/ReqnrollAutomation
        continue-on-error: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Dynamically logs into personal NuGet feed using the stored secret
      - name: Authenticate NuGet Feed
        run: |
          dotnet nuget update source "khangvum-nuget" `
            --username "khangvum" `
            --password "${{ secrets.PAT_PACKAGE_READ_TOKEN }}" `
            --store-password-in-clear-text

      - name: Restore
        run: dotnet restore

      - name: Run Test
        shell: powershell
        run: |
          # Safe fallback values for push events where inputs are null
          $targetProject = "${{ inputs.target_project }}"
          if ([string]::IsNullOrWhiteSpace($targetProject)) { $targetProject = "CarfaxCanadaWebsite" }

          $executionMode = "${{ inputs.execution_mode }}"
          if ([string]::IsNullOrWhiteSpace($executionMode)) { $executionMode = "parallel" }

          $category = "${{ inputs.category }}"

          # Build the filter value
          $filterValue = ""
          if (-not [string]::IsNullOrWhiteSpace($targetProject)) {
            $filterValue = "FullyQualifiedName~$targetProject"
          }

          # Append category filter if present
          if (-not [string]::IsNullOrWhiteSpace($category)) {
            if ($filterValue) {
              $filterValue = "$filterValue&TestCategory=$category"
            } else {
              $filterValue = "TestCategory=$category"
            }
          }

          # Build argument list
          $testArgs = @(
              "test",
              "--configuration", "Release",
              "--no-restore",
              "--settings", "./$executionMode.runsettings"
          )

          if ($filterValue) {
            $testArgs += @("--filter", $filterValue)
          }

          # Execute dotnet test with splatted arguments
          dotnet @testArgs

      - name: Upload Test Results
        if: always() # Ensure this step runs even if tests fail
        uses: actions/upload-artifact@v7
        with:
          name: TestReport
          path: '**/TestResults/ReqnrollAutomation/**/*'
          retention-days: 7