name: Reqnroll Automation

on:
  workflow_dispatch:
    inputs:
      target_project:
        description: "Target Project"
        required: true
        default: "Carfax Canada Website"
        type: choice
        options:
          - "Carfax Canada Website"
          - SwagLabs
      execution_mode:
        description: "Execution Mode"
        required: true
        default: "parallel"
        type: choice
        options:
          - parallel
          - sequential
      category:
        description: "Category"
        required: false
        default: ""
        type: string
      browser:
        description: "Browser"
        required: true
        default: "Chrome"
        type: choice
        options:
          - Chrome
          - Edge
      test_environment:
        description: "Test Environment"
        required: true
        default: "QA"
        type: choice
        options:
          - QA
          - Dev
          - Prod

  # Automatically trigger the workflow on push to the master branch
  push:
    branches:
      - master
    paths:
      - 'ReqnrollAutomation/**'

jobs:
  test:
    runs-on: windows-latest
    env:
      Headless: "true"
      TargetProject: ${{ inputs.target_project || 'Carfax Canada Website' }}
      Browser: ${{ inputs.browser || 'Chrome' }}
      # Fallback to QA if triggered via push instead of workflow_dispatch
      TestEnvironment: ${{ inputs.test_environment || 'QA' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Set up .NET early to evaluate project names
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Normalize and set target project environment variable (stripping spaces)
      - name: Set Target Project Environment Variable
        shell: powershell
        run: |
          $targetProject = "${{ inputs.target_project }}"
          if ([string]::IsNullOrWhiteSpace($targetProject)) { $targetProject = "CarfaxCanadaWebsite" }

          # Strip spaces
          $targetProject = $targetProject.Replace(' ', '')

          echo "TARGET_PROJECT=$targetProject" >> $env:GITHUB_ENV
          Write-Host "Target Project: $targetProject"

      # Download previous test results if this is a rerun attempt
      - name: Download Previous Test Results
        if: github.run_attempt > 1
        uses: actions/download-artifact@v8
        with:
          name: TestReport
          path: TestResults/${{ env.TARGET_PROJECT }}
        continue-on-error: true

      # Dynamically logs into personal NuGet feed using the stored secret
      - name: Authenticate NuGet Feed
        run: |
          dotnet nuget update source "khangvum-nuget" `
            --username "khangvum" `
            --password "${{ secrets.PAT_PACKAGE_READ_TOKEN }}" `
            --store-password-in-clear-text

      - name: Restore
        run: dotnet restore

      - name: Run Test
        shell: powershell
        run: |
          $executionMode = "${{ inputs.execution_mode }}"
          if ([string]::IsNullOrWhiteSpace($executionMode)) { $executionMode = "parallel" }

          $category = "${{ inputs.category }}"

          # Build the filter value
          $filterValue = ""
          if (-not [string]::IsNullOrWhiteSpace($env:TARGET_PROJECT)) {
            $filterValue = "FullyQualifiedName~$env:TARGET_PROJECT"
          }

          # Append category filter if present
          if (-not [string]::IsNullOrWhiteSpace($category)) {
            if ($filterValue) {
              $filterValue = "$filterValue&TestCategory=$category"
            } else {
              $filterValue = "TestCategory=$category"
            }
          }

          # Build argument list
          $testArgs = @(
              "test",
              "--configuration", "Release",
              "--no-restore",
              "--settings", "./$executionMode.runsettings"
          )

          if ($filterValue) {
            $testArgs += @("--filter", $filterValue)
          }

          # Execute dotnet test with splatted arguments
          dotnet @testArgs

      - name: Upload Test Results
        if: always() # Ensure this step runs even if tests fail
        uses: actions/upload-artifact@v7
        with:
          name: TestReport
          path: TestResults/${{ env.TARGET_PROJECT }}/*
          retention-days: 7