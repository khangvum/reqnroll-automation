name: Reqnroll Automation

on:
  workflow_dispatch:
    inputs:
      target_project:
        description: "Target Project"
        required: true
        default: "CarfaxCanada"
        type: choice
        options:
          - CarfaxCanada
          - SwagLabs
      execution_mode:
        description: "Execution Mode"
        required: true
        default: "parallel"
        type: choice
        options:
          - parallel
          - sequential
      category:
        description: "Category"
        required: false
        default: ""
        type: string
      test_environment:
        description: "Test Environment"
        required: true
        default: "QA"
        type: choice
        options:
          - QA
          - Dev
          - Prod

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      Headless: true
      TestEnvironment: ${{ inputs.test_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Run Test
        run: |
          # Filter tests based on the selected target project
          FILTER_ARG="--filter FullyQualifiedName~${{ inputs.target_project }}"

          # Append the category tag condition if provided
          if [ -n "${{ inputs.category }}" ]; then
            FILTER_ARG="$FILTER_ARG&TestCategory=${{ inputs.category }}"
          fi

          # Execute the target suite
          dotnet test \
            --configuration Release \
            --no-restore \
            --settings ./${{ inputs.execution_mode }}.runsettings \
            $FILTER_ARG

      - name: Upload Test Results
        if: always() # Ensure this step runs even if the tests fail
        uses: actions/upload-artifact@v7
        with:
          name: TestReport
          path: '**/TestResults/ReqnrollAutomation/**/*'
          retention-days: 7
